<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My CI/CD Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f9;
        }
        h1 { color: #2c3e50; }
        .status {
            display: inline-block;
            padding: 10px 20px;
            background-color: #2ecc71;
            color: white;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 id="welcome-title">Welcome to My Automated Website!</h1>
    <p>這是一個透過 GitHub Actions 自動化測試並部署的網站。</p>
    <div class="status" id="deploy-status">Status: Deployed via GitHub Actions</div>
</body>
</html>
