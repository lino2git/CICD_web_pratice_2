name: CI/CD Pipeline to GitHub Pages

on:
  push:
    branches: [ "main" ]

# 設定 GitHub Actions 的 GITHUB_TOKEN 權限以允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 限制同一時間只能有一個部署任務進行
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ----------------------------------
  # 任務 1：CI - 自動化測試 (Test Job)
  # ----------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝套件與 Playwright 瀏覽器
      run: |
        python -m pip install --upgrade pip
        pip install pytest-playwright
        playwright install --with-deps

    - name: 執行 CI 自動化測試
      run: |
        pytest test_deploy_ui.py --screenshot=only-on-failure --video=retain-on-failure --output=test-results

    - name: 上傳測試失敗記錄 (僅在失敗時執行)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-failure-artifacts
        path: test-results/

  # ----------------------------------
  # 任務 2：CD - 自動部署 (Deploy Job)
  # ----------------------------------
  deploy:
    # 關鍵：指定 deploy 必須等待 test 任務順利完成 (Pass) 才能啟動
    needs: test
    runs-on: ubuntu-latest
    
    # 確保僅在 main 分支觸發時進行部署
    if: github.ref == 'refs/heads/main'

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v4

    - name: 設定 GitHub Pages 資源環境
      uses: actions/configure-pages@v5

    - name: 上傳靜態網頁檔案 (Upload Artifact)
      uses: actions/upload-pages-artifact@v3
      with:
        # 部署整個專案根目錄（包含 index.html）
        path: '.'

    - name: 部署至 GitHub Pages 線上環境
      id: deployment
      uses: actions/deploy-pages@v4